name: Build Smart Accountant APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Required so the job can create GitHub Releases with GITHUB_TOKEN
# (new repositories default to read-only token permissions).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: Run tests
        run: flutter test

      # Static analysis gate (informational — keeps the pipeline green
      # while the codebase is still evolving).
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK Release
        run: flutter build apk --release --dart-define=CODECRAFT_API_KEY=${{ secrets.CODECRAFT_API_KEY }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-accountant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
