name: smart_personal_accountant
description: "المحاسب الذكي - Smart Personal Accountant AI App. Offline-first Arabic personal finance manager with an AI accountant (CodeCraft API / claude-opus-5.5), voice entry, OCR receipt scanning, budgets and reports."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # ---- State management (Riverpod) ----
  flutter_riverpod: ^2.5.1

  # ---- Local DB: Hive (offline-first) ----
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  path_provider: ^2.1.3

  # ---- Offline-first & connectivity ----
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3

  # ---- Firebase ----
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.5
  cloud_firestore: ^4.17.3
  firebase_messaging: ^14.9.4

  # ---- AI (CodeCraft API - claude-opus-5.5) ----
  http: ^1.2.1

  # ---- Charts ----
  fl_chart: ^0.67.0

  # ---- Voice input ----
  speech_to_text: ^6.6.0

  # ---- OCR receipt scanner (PRO) ----
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.1.1

  # ---- Security: biometric lock + encrypted Hive key storage ----
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2

  # ---- Local notifications (budget 80% / 100% alerts) ----
  flutter_local_notifications: ^17.1.2

  # ---- Auth country selector (phone login) ----
  country_picker: ^2.0.26

  # ---- Reports: PDF & Excel export ----
  pdf: ^3.10.8
  printing: ^5.12.0
  excel: ^4.0.2
  share_plus: ^9.0.0

  # ---- Monetization ----
  in_app_purchase: ^3.1.13
  google_mobile_ads: ^5.0.0

  # ---- UI / UX ----
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.0
  fluttertoast: ^8.2.4
  flutter_launcher_icons: ^0.13.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: "launcher_icon"
  min_sdk_android: 23
  adaptive_icon_background: "#0F2A54"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
